name: CI

on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: zx-t1-dood          # ← 换成你们的 runnerScaleSetName
    steps:
      # ① _actions/  +  _work/<repo>/<repo>/
      - name: Checkout
        uses: actions/checkout@v4

      # ② _tool/  （setup-* 把工具链装进工具缓存）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ③ _actions/ 再多一个（JS action，验证 externals/node20 在被用）
      - name: JS action
        uses: actions/github-script@v7
        with:
          script: core.info('hello from node')

      # ④ _temp/  （环境文件、输出文件、step summary 都落在这里）
      - name: Touch temp files
        id: vars
        run: |
          echo "MY_VAR=hello"  >> "$GITHUB_ENV"
          echo "my_out=world"  >> "$GITHUB_OUTPUT"
          echo "### probe ran" >> "$GITHUB_STEP_SUMMARY"
          echo "GITHUB_ENV    = $GITHUB_ENV"
          echo "GITHUB_OUTPUT = $GITHUB_OUTPUT"
          echo "GITHUB_STEP_SUMMARY = $GITHUB_STEP_SUMMARY"

      # ⑤ 打印全树
      - name: Dump runner layout
        if: always()
        run: |
          echo "=============== 环境变量 ==============="
          env | grep -E '^(HOME|RUNNER_|GITHUB_WORKSPACE|ACTIONS_RUNNER)' | sort

          echo; echo "=============== /home/runner 顶层 ==============="
          ls -la /home/runner/

          echo; echo "=============== _work 顶层（看 _actions/_tool 在哪一层）==============="
          ls -la /home/runner/_work/

          echo; echo "=============== 代码目录 ==============="
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE" | head -20

          echo; echo "=============== _actions（下载的 action 源码）==============="
          find /home/runner/_work/_actions -maxdepth 3 -type d 2>/dev/null | head -40

          echo; echo "=============== _tool（工具链缓存）==============="
          find /home/runner/_work/_tool -maxdepth 3 -type d 2>/dev/null | head -40
          du -sh /home/runner/_work/_tool 2>/dev/null

          echo; echo "=============== _temp ==============="
          ls -la /home/runner/_work/_temp/ 2>/dev/null | head -30

          echo; echo "=============== _PipelineMapping ==============="
          find /home/runner/_work/_PipelineMapping -type f 2>/dev/null
          cat /home/runner/_work/_PipelineMapping/*/* 2>/dev/null

          echo; echo "=============== _diag（agent 日志）==============="
          ls -la /home/runner/_diag/ 2>/dev/null || echo "（看不到，说明 job 不在 runner 容器里跑）"
          tail -5 /home/runner/_diag/Worker_*.log 2>/dev/null

          echo; echo "=============== 注册文件（只看存在性，不打印内容）==============="
          ls -la /home/runner/.runner /home/runner/.credentials* 2>/dev/null
          echo "--- .runner 内容（不含密钥）---"
          cat /home/runner/.runner 2>/dev/null

          echo; echo "=============== externals ==============="
          ls -la /home/runner/externals/
          /home/runner/externals/node20/bin/node --version
      - run: sleep 1800s
  # build:
  #   runs-on: zx-t1-dood
  #   steps:
  #     - run: sleep 1800s

  test:
    runs-on: label-t2
    steps:
      - run: echo "Running tests2..."

  prod:
    runs-on: label-t3
    steps:
      - run: echo "Running prod2..."
